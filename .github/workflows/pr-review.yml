name: AI Code Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      head_sha:
        description: 'SHA of the PR head commit'
        required: true
        type: string
      repository:
        description: 'Repository to review (owner/repo)'
        required: false
        type: string
        default: ''
      use_rag:
        description: 'Enable RAG context gathering'
        required: false
        type: boolean
        default: true
    secrets:
      DEEPSEEK_API_KEY:
        description: 'DeepSeek API key'
        required: true
      DEEPSEEK_BASE_URL:
        description: 'DeepSeek API base URL'
        required: false
      DEEPSEEK_MODEL:
        description: 'DeepSeek model name'
        required: false
    outputs:
      issues_count:
        description: 'Number of issues found'
        value: ${{ jobs.review.outputs.issues_count }}

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      issues_count: ${{ steps.review.outputs.issues_count }}
    
    steps:
      - name: Determine repository
        id: repo
        run: |
          if [ -n "${{ inputs.repository }}" ]; then
            REPO="${{ inputs.repository }}"
          else
            REPO="${{ github.repository }}"
          fi
          echo "repository=$REPO" >> $GITHUB_OUTPUT
          echo "owner=$(echo $REPO | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "name=$(echo $REPO | cut -d'/' -f2)" >> $GITHUB_OUTPUT

          echo "repo_path=/home/runner/work/$name/$name" >> $GITHUB_OUTPUT

          echo "henchman_path=/home/runner/work/$name/$name/.henchman" >> $GITHUB_OUTPUT

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo.outputs.repository }}
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone henchman
        uses: actions/checkout@v4
        with:
          repository: LyubimoVV/henchman
          ref: master
          path: .henchman
          fetch-depth: 1

      - name: Install henchman dependencies
        working-directory: .henchman
        run: npm ci

      - name: Cache RAG index
        if: ${{ inputs.use_rag }}
        uses: actions/cache@v4
        with:
          path: ~/.henchman
          key: rag-index-${{ steps.repo.outputs.repository }}-${{ hashFiles('**/*.ts', '**/*.js', '**/*.java', '**/*.py', '**/*.md') }}
          restore-keys: |
            rag-index-${{ steps.repo.outputs.repository }}-
            rag-index-

      - name: Install Ollama (for embeddings)
        if: ${{ inputs.use_rag }}
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      - name: Wait for Ollama and pull model
        if: ${{ inputs.use_rag }}
        run: |
          echo "Waiting for Ollama to start..."
          timeout 120 bash -c 'until curl -s http://localhost:11434/api/tags > /dev/null; do sleep 3; done'
          echo "Pulling nomic-embed-text model..."
          ollama pull nomic-embed-text

      - name: Run AI Code Review
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
          OLLAMA_BASE_URL: http://localhost:11434
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RAG_FLAG=""
          if [ "${{ inputs.use_rag }}" != "true" ]; then
            RAG_FLAG="--no-rag"
          fi
          
          echo "Running AI code review..."
          cd .henchman
          npx tsx src/index.ts review \
            --pr ${{ inputs.pr_number }} \
            --format github \
            --output ../review-output.md \
            -p .. \
            $RAG_FLAG || true
          
          ISSUES=0
          if [ -f ../.henchman-annotations.json ]; then
            ISSUES=$(cat ../.henchman-annotations.json | jq 'length' || echo "0")
          fi
          echo "issues_count=$ISSUES" >> $GITHUB_OUTPUT
          echo "Review complete. Found $ISSUES issues."

      - name: Post Review Comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f ../.henchman-review-comment.md ]; then
            echo "Posting review comment..."
            gh pr comment ${{ inputs.pr_number }} \
              --repo ${{ steps.repo.outputs.repository }} \
              --body-file ../.henchman-review-comment.md || true
            echo "Review comment posted successfully"
          else
            echo "No review comment file found"
          fi
      - name: Create Check Run with Annotations
        if: always() && hashFiles('../.henchman-annotations.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ANNOTATIONS_FILE=../.henchman-annotations.json
          
          if [ ! -f "$ANNOTATIONS_FILE" ]; then
            echo "No annotations file found"
            exit 0
          fi
          
          ANNOTATIONS=$(cat "$ANNOTATIONS_FILE")
          CRITICAL_COUNT=$(echo "$ANNOTATIONS" | jq '[.[] | select(.annotation_level == "failure")] | length')
          WARNING_COUNT=$(echo "$ANNOTATIONS" | jq '[.[] | select(.annotation_level == "warning")] | length')
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            CONCLUSION="failure"
            TITLE="Found $CRITICAL_COUNT critical issues"
          elif [ "$WARNING_COUNT" -gt 0 ]; then
            CONCLUSION="neutral"
            TITLE="Found $WARNING_COUNT warnings"
          else
            CONCLUSION="success"
            TITLE="No issues found"
          fi
          
          echo "Creating check run with conclusion: $CONCLUSION"
          
          cat > /tmp/check-output.json <<EOF
          {
            "name": "AI Code Review",
            "head_sha": "${{ inputs.head_sha }}",
            "status": "completed",
            "conclusion": "$CONCLUSION",
            "output": {
              "title": "$TITLE",
              "summary": "Review completed",
              "annotations": $ANNOTATIONS
            }
          }
          EOF
          
          gh api \
            repos/${{ steps.repo.outputs.repository }}/check-runs \
            --input @/tmp/check-output.json || true
          
          echo "Check run created successfully"

      - name: Upload Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-output-${{ inputs.pr_number }}
          path: |
            review-output.md
            .henchman-review-comment.md
            .henchman-annotations.json
          retention-days: 7
          if-no-files-found: ignore
